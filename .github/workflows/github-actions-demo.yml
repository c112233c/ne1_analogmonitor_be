name: Build and Push - ne1_analogmonitor_be

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL || '' }}
            VITE_KEYCLOAK_URL=${{ vars.VITE_KEYCLOAK_URL || '' }}
            VITE_KEYCLOAK_REALM=${{ vars.VITE_KEYCLOAK_REALM || '' }}
            VITE_KEYCLOAK_CLIENT_ID=${{ vars.VITE_KEYCLOAK_CLIENT_ID || '' }}

  update-gitops:
    runs-on: ubuntu-latest
    needs: docker

    steps:
      - name: Checkout GitOps repo
        uses: actions/checkout@v4
        with:
          repository: c112233c/ne1_analogmonitor_gitops
          token: ${{ secrets.GITOPS_TOKEN }}
          path: gitops

      - name: Update image tag in values.yaml
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          cd gitops
          if ! grep -q '^image:' be/values.yaml 2>/dev/null; then
            printf 'image:\n  repository: ghcr.io/${{ github.repository_owner }}/ne1_analogmonitor\n  tag: "%s"\n' "$IMAGE_TAG" > be/values.yaml
          else
            sed -i -E 's|^([[:space:]]*tag:[[:space:]]*")[^"]*(")$|\1'"$IMAGE_TAG"'\2|' be/values.yaml
          fi
          echo "--- be/values.yaml ---"
          cat be/values.yaml

      - name: Commit and push
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          cd gitops
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add be/values.yaml
          if git diff --cached --quiet; then
            echo "No changes to values.yaml"
            exit 0
          fi
          git commit -m "Update image tag to ${IMAGE_TAG}"
          git push
